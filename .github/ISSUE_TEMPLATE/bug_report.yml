name: Ошибка / Bug report
title: "[BUG] "
description: Сообщить об ошибке LOOM

body:
  - type: markdown
    attributes:
      value: |
        Не публикуйте ссылку подписки, ключи или другие секреты. Сначала проверьте [существующие задачи](https://github.com/celestialvibes/FlClash/issues).
  - type: textarea
    id: description
    attributes:
      label: Что произошло?
      description: Опишите ошибку и ожидаемый результат
    validations:
      required: true
  - type: textarea
    attributes:
      label: Версия LOOM
      description: Указана в настройках приложения
    validations:
      required: true
  - type: textarea
    attributes:
      label: Как повторить?
      description: Перечислите шаги
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Платформа
      options:
        - Android
        - macOS
    validations:
      required: true
  - type: input
    attributes:
      label: Версия ОС
      description: Например, macOS 15.6
    validations:
      required: true
  - type: textarea
    attributes:
      label: Лог без секретов
      description: Приложите только относящийся к ошибке фрагмент и удалите ссылки подписки и ключи

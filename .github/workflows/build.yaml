name: build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Build platform
        required: true
        default: all
        type: choice
        options:
          - all
          - macos
          - windows
  push:
    branches:
      - loom
    tags:
      - 'v*'
env:
  IS_STABLE: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
  FLUTTER_VERSION: '3.44.4'

jobs:
  test:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all'
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Test release notes generation
        shell: bash
        run: bash .github/scripts/generate_release_notes_test.sh

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test --reporter expanded

      - name: Validate local Flutter packages
        shell: bash
        run: |
          for package in plugins/proxy plugins/wifi_ssid plugins/window_ext plugins/setup; do
            (
              cd "$package"
              flutter pub get
              flutter analyze --no-fatal-infos
            )
          done

      - name: Run local plugin tests
        shell: bash
        run: |
          (
            cd plugins/proxy
            flutter test --reporter expanded
          )
          (
            cd plugins/wifi_ssid
            flutter test --reporter expanded
          )

      - name: Validate setup build tool
        working-directory: plugins/setup/buildkit/build_tool
        run: |
          dart pub get
          dart analyze
          dart test

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.4'
          cache-dependency-path: core/go.sum

      - name: Validate Go core wrapper
        working-directory: core
        env:
          CGO_ENABLED: 0
        run: |
          go test .
          go vet .

      - name: Validate Rust components
        run: |
          cargo fmt --manifest-path services/helper/Cargo.toml -- --check
          cargo test --manifest-path services/helper/Cargo.toml
          cargo fmt --manifest-path plugins/rust_api/rust/Cargo.toml -- --check
          cargo test --manifest-path plugins/rust_api/rust/Cargo.toml

  build:
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'windows'
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.4'
          cache-dependency-path: |
            core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app || sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter pub get

      - name: Setup
        run: dart setup.dart macos ${{ env.IS_STABLE == 'true' && '--env stable' || '' }}

      - name: Verify macOS package
        shell: bash
        run: |
          app=build/macos/Build/Products/Release/LOOM.app
          dmg=(dist/*.dmg)
          test -d "$app"
          test "${#dmg[@]}" -eq 1
          codesign --verify --deep --strict "$app"
          file "$app/Contents/MacOS/LOOM" | grep -q 'arm64'
          file "$app/Contents/MacOS/LOOM" | grep -vq 'x86_64'
          hdiutil verify "${dmg[0]}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            codesign -dv --verbose=4 "$app" 2>&1 | grep -q 'flags=.*runtime'
            codesign -dv --verbose=4 "$app/Contents/MacOS/FlClashCore" 2>&1 | grep -q 'flags=.*runtime'
            codesign -dv --verbose=4 "$app" 2>&1 | grep -q '^Authority=Developer ID Application:'
            xcrun stapler validate "${dmg[0]}"
          fi

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: artifact-macos-arm64
          path: ./dist
          overwrite: true

  build-windows:
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'macos'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.4'
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build portable x64 package
        run: dart setup.dart windows --env stable --targets zip

      - name: Verify Windows package
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/*.zip
          if ($zip.Count -ne 1) { throw "Expected exactly one Windows zip" }
          Expand-Archive $zip.FullName build/windows-verify
          $exe = Get-ChildItem build/windows-verify -Filter LOOM.exe -Recurse
          if ($exe.Count -ne 1) { throw "LOOM.exe missing from package" }

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: artifact-windows-x64
          path: ./dist
          overwrite: true

  release:
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name != 'workflow_dispatch' || inputs.platform == 'all')
    permissions:
      contents: write
    needs: [ test, build, build-windows ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download
        uses: actions/download-artifact@v8
        with:
          name: artifact-macos-arm64
          path: ./dist/

      - name: Download Windows
        uses: actions/download-artifact@v8
        with:
          name: artifact-windows-x64
          path: ./dist/

      - name: Generate release.md
        shell: bash
        run: |
          pre_tag=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          bash .github/scripts/generate_release_notes.sh "$pre_tag" release.md

      - name: Patch release.md
        run: |
          version=$(sed -nE 's/^version: ([^+]+).*/\1/p' pubspec.yaml)
          sed \
            -e "s|TAG|${GITHUB_REF_NAME}|g" \
            -e "s|VERSION|$version|g" \
            .github/release_template.md >> release.md

      - name: Generate sha256
        run: |
          cd ./dist
          sha256sum ./* > SHA256SUMS

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: ./dist/*
          body_path: './release.md'
          prerelease: ${{ contains(github.ref_name, '-') }}
